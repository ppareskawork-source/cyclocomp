<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CycloComp Pro</title>
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            height: 100dvh;
            width: 100vw;
            background-color: #121212; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        
        /* Bagian Atas / Header */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background-color: #1e1e1e;
        }
        .title-area { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .indicator { width: 12px; height: 12px; border-radius: 50%; background-color: #ff4444; }
        .indicator.online { background-color: #00C851; }
        
        /* Dashboard Metrik */
        .dashboard { padding: 15px; flex-shrink: 0; }
        .speed-display { text-align: center; margin-bottom: 15px; }
        .speed-display span { font-size: 5rem; font-weight: bold; line-height: 1; }
        .speed-display small { font-size: 1.5rem; color: #888; }
        
        .metrics-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center;
        }
        .metric-box { background-color: #1e1e1e; padding: 10px 5px; border-radius: 8px; }
        .metric-box label { display: block; font-size: 0.65rem; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        .metric-box div { font-size: 1.1rem; font-weight: bold; }
        
        /* Peta */
        #map {
            flex-grow: 1;
            width: 100%;
            background-color: #333;
        }

        /* Tombol Bawah */
        .bottom-controls {
            padding: 15px 15px 30px 15px;
            background-color: #1e1e1e; display: flex; gap: 10px; flex-shrink: 0;
        }
        button {
            flex: 1; padding: 15px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px;
            color: white; cursor: pointer; text-transform: uppercase;
        }
        #startBtn { background-color: #00C851; }
        #stopBtn { background-color: #ff4444; display: none; }
        
        /* Tombol Leaflet disesuaikan untuk mode gelap */
        .leaflet-control-zoom a { background-color: #1e1e1e !important; color: white !important; border: 1px solid #444 !important; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="title-area">
            CYCLOCOMP <div id="db-indicator" class="indicator"></div>
        </div>
        <div id="time-display">00:00:00</div>
    </div>

    <div class="dashboard">
        <div class="speed-display">
            <span id="val-speed">0.0</span> <small>km/h</small>
        </div>
        <div class="metrics-grid">
            <div class="metric-box"><label>Jarak (KM)</label><div id="val-dist">0.00</div></div>
            <div class="metric-box"><label>Avg (KM/H)</label><div id="val-avg">0.0</div></div>
            <div class="metric-box"><label>Max (KM/H)</label><div id="val-max">0.0</div></div>
            <div class="metric-box"><label>Elevasi (M)</label><div id="val-ele">--</div></div>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-controls">
        <button id="startBtn">START</button>
        <button id="stopBtn">STOP & SAVE</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDPKhGq_dGVqGViQIwbDHtwAA7DLfuNYa4",
            authDomain: "cyclocomp-f9bdb.firebaseapp.com",
            projectId: "cyclocomp-f9bdb",
            storageBucket: "cyclocomp-f9bdb.firebasestorage.app",
            messagingSenderId: "942879429280",
            appId: "1:942879429280:web:3b44bf2262cb082b5c6fc5",
            measurementId: "G-M45DT3DHST"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const dbIndicator = document.getElementById('db-indicator');

        // Login Anonim otomatis untuk Database
        signInAnonymously(auth).then(() => {
            dbIndicator.classList.add('online');
            console.log("Firebase Connected!");
        }).catch((error) => {
            console.error("Firebase Auth Error:", error);
        });

        // Ekspor fungsi save untuk dipanggil tombol STOP
        window.saveRouteToFirebase = async function(routeData) {
            try {
                await addDoc(collection(db, "rides"), {
                    userId: auth.currentUser.uid,
                    date: new Date().toISOString(),
                    distance_km: routeData.distance,
                    avg_speed_kmh: routeData.avgSpeed,
                    max_speed_kmh: routeData.maxSpeed,
                    duration_sec: routeData.duration
                });
                alert("Data perjalanan berhasil disimpan ke riwayat!");
            } catch (e) {
                console.error("Error saving document: ", e);
                alert("Gagal menyimpan data ke database. Pastikan Firestore rules sudah diperbarui.");
            }
        }
    </script>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Core App Logic -->
    <script>
        let map, polyline;
        let watchId = null;
        let isTracking = false;
        let startTime = 0;
        let timerInterval;
        let positions = [];
        
        let totalDistance = 0;
        let maxSpeed = 0;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const valSpeed = document.getElementById('val-speed');
        const valDist = document.getElementById('val-dist');
        const valAvg = document.getElementById('val-avg');
        const valMax = document.getElementById('val-max');
        const valEle = document.getElementById('val-ele');
        const timeDisplay = document.getElementById('time-display');

        function initMap(lat, lng) {
            if (!map) {
                map = L.map('map').setView([lat, lng], 16);
                
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                polyline = L.polyline([], {color: '#ff4444', weight: 5}).addTo(map);
            } else {
                map.setView([lat, lng]);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function updateTimer() {
            const now = Date.now();
            const diff = new Date(now - startTime);
            const hh = String(diff.getUTCHours()).padStart(2, '0');
            const mm = String(diff.getUTCMinutes()).padStart(2, '0');
            const ss = String(diff.getUTCSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${hh}:${mm}:${ss}`;
        }

        startBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("GPS tidak didukung di perangkat ini.");
                return;
            }

            isTracking = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);

            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch((err) => console.log("Layar mungkin redup: ", err));
            }

            watchId = navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const speed = (position.coords.speed || 0) * 3.6;
                const alt = position.coords.altitude;
                const accuracy = position.coords.accuracy;

                if (accuracy > 30) return;

                initMap(lat, lng);
                polyline.addLatLng([lat, lng]);

                if (positions.length > 0) {
                    const lastPos = positions[positions.length - 1];
                    const dist = calculateDistance(lastPos.lat, lastPos.lng, lat, lng);
                    totalDistance += dist;
                }
                
                positions.push({lat, lng, time: Date.now()});

                let currentSpeed = speed;
                if(currentSpeed < 1.5) currentSpeed = 0;
                
                if (currentSpeed > maxSpeed) maxSpeed = currentSpeed;
                
                let durationHours = (Date.now() - startTime) / 3600000;
                let avgSpeed = durationHours > 0 ? totalDistance / durationHours : 0;

                valSpeed.textContent = currentSpeed.toFixed(1);
                valDist.textContent = totalDistance.toFixed(2);
                valMax.textContent = maxSpeed.toFixed(1);
                valAvg.textContent = avgSpeed.toFixed(1);
                
                if (alt) valEle.textContent = Math.round(alt);

            }, (err) => {
                console.warn('GPS Error:', err.message);
            }, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        });

        stopBtn.addEventListener('click', () => {
            isTracking = false;
            navigator.geolocation.clearWatch(watchId);
            clearInterval(timerInterval);
            
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';

            let durationSeconds = Math.floor((Date.now() - startTime) / 1000);
            let avgSpeed = parseFloat(valAvg.textContent);

            if (window.saveRouteToFirebase && totalDistance > 0) {
                window.saveRouteToFirebase({
                    distance: parseFloat(totalDistance.toFixed(2)),
                    maxSpeed: parseFloat(maxSpeed.toFixed(1)),
                    avgSpeed: avgSpeed,
                    duration: durationSeconds
                });
            } else if (totalDistance === 0) {
                alert("Perjalanan dihentikan. Jarak masih 0 KM, tidak disimpan.");
            }
            
            totalDistance = 0; maxSpeed = 0; positions = [];
            if(polyline) polyline.setLatLngs([]);
            timeDisplay.textContent = "00:00:00";
        });
    </script>
</body>
</html>
