<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CycloComp Pro</title>
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            height: 100dvh;
            width: 100vw;
            background-color: #121212; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        
        /* Bagian Atas / Header */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background-color: #1e1e1e;
        }
        .title-area { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .indicator { width: 12px; height: 12px; border-radius: 50%; background-color: #ff4444; }
        .indicator.online { background-color: #00C851; }
        .top-right { display: flex; gap: 12px; align-items: center; }
        
        /* Tombol Riwayat Mini */
        #historyBtn {
            padding: 6px 12px; font-size: 0.8rem; font-weight: bold; border-radius: 6px;
            background-color: #333; color: white; border: 1px solid #555; cursor: pointer;
        }
        
        /* Dashboard Metrik */
        .dashboard { padding: 15px; flex-shrink: 0; }
        .speed-display { text-align: center; margin-bottom: 15px; }
        .speed-display span { font-size: 5rem; font-weight: bold; line-height: 1; }
        .speed-display small { font-size: 1.5rem; color: #888; }
        
        .metrics-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center;
        }
        .metric-box { background-color: #1e1e1e; padding: 10px 5px; border-radius: 8px; }
        .metric-box label { display: block; font-size: 0.65rem; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        .metric-box div { font-size: 1.1rem; font-weight: bold; }
        
        /* Peta */
        #map {
            flex-grow: 1;
            width: 100%;
            background-color: #333;
        }

        /* Tombol Bawah */
        .bottom-controls {
            padding: 15px 15px 30px 15px;
            background-color: #1e1e1e; display: flex; gap: 10px; flex-shrink: 0;
        }
        .big-btn {
            flex: 1; padding: 15px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px;
            color: white; cursor: pointer; text-transform: uppercase;
        }
        #startBtn { background-color: #00C851; }
        #stopBtn { background-color: #ff4444; display: none; }
        
        /* Modal Riwayat */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #1e1e1e; margin: 15% auto; padding: 20px; width: 90%; max-width: 400px; border-radius: 12px; max-height: 70vh; overflow-y: auto; }
        .close-modal { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .history-item { border-bottom: 1px solid #333; padding: 12px 0; }
        .history-item:last-child { border-bottom: none; }
        .h-date { font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
        .h-stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="title-area">
            CYCLOCOMP <div id="db-indicator" class="indicator"></div>
        </div>
        <div class="top-right">
            <button id="historyBtn">RIWAYAT</button>
            <div id="time-display">00:00:00</div>
        </div>
    </div>

    <div class="dashboard">
        <div class="speed-display">
            <span id="val-speed">0.0</span> <small>km/h</small>
        </div>
        <div class="metrics-grid">
            <div class="metric-box"><label>Jarak (KM)</label><div id="val-dist">0.00</div></div>
            <div class="metric-box"><label>Avg (KM/H)</label><div id="val-avg">0.0</div></div>
            <div class="metric-box"><label>Max (KM/H)</label><div id="val-max">0.0</div></div>
            <div class="metric-box"><label>Elevasi (M)</label><div id="val-ele">--</div></div>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-controls">
        <button id="startBtn" class="big-btn">START</button>
        <button id="stopBtn" class="big-btn">STOP & SAVE</button>
    </div>

    <!-- Modal Pop-up Riwayat -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 style="margin-top: 0;">Riwayat Gowes</h2>
            <div id="historyList">Memuat...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDPKhGq_dGVqGViQIwbDHtwAA7DLfuNYa4",
            authDomain: "cyclocomp-f9bdb.firebaseapp.com",
            projectId: "cyclocomp-f9bdb",
            storageBucket: "cyclocomp-f9bdb.firebasestorage.app",
            messagingSenderId: "942879429280",
            appId: "1:942879429280:web:3b44bf2262cb082b5c6fc5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const dbIndicator = document.getElementById('db-indicator');

        signInAnonymously(auth).then(() => {
            dbIndicator.classList.add('online');
        }).catch((error) => console.error("Firebase Auth Error:", error));

        // Fungsi Simpan
        window.saveRouteToFirebase = async function(routeData) {
            try {
                await addDoc(collection(db, "rides"), {
                    userId: auth.currentUser.uid,
                    date: new Date().toISOString(),
                    distance_km: routeData.distance,
                    avg_speed_kmh: routeData.avgSpeed,
                    max_speed_kmh: routeData.maxSpeed
                });
                alert("Data perjalanan berhasil disimpan!");
            } catch (e) {
                alert("Gagal menyimpan data.");
            }
        }

        // Fungsi Load Riwayat
        window.loadHistoryFromFirebase = async function() {
            const listDiv = document.getElementById('historyList');
            listDiv.innerHTML = "Memuat data...";
            try {
                if (!auth.currentUser) throw new Error("Belum terhubung ke database.");
                
                // Ambil data khusus milik user ini
                const q = query(collection(db, "rides"), where("userId", "==", auth.currentUser.uid));
                const querySnapshot = await getDocs(q);
                
                let rides = [];
                querySnapshot.forEach((doc) => rides.push(doc.data()));
                
                // Urutkan dari yang terbaru (descending)
                rides.sort((a, b) => new Date(b.date) - new Date(a.date));

                listDiv.innerHTML = "";
                if (rides.length === 0) {
                    listDiv.innerHTML = "Belum ada riwayat gowes.";
                    return;
                }

                rides.forEach(data => {
                    const dateStr = new Date(data.date).toLocaleString('id-ID', {
                        weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                    });
                    listDiv.innerHTML += `
                        <div class="history-item">
                            <div class="h-date">${dateStr}</div>
                            <div class="h-stats">
                                <span style="color:#00C851;">${data.distance_km} KM</span>
                                <span style="color:#aaa; font-size: 0.9rem;">Avg: ${data.avg_speed_kmh} km/h</span>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                listDiv.innerHTML = "Gagal memuat riwayat.";
            }
        }
    </script>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Core App Logic -->
    <script>
        let map, polyline, userMarker;
        let watchId = null;
        let isTracking = false;
        let startTime = 0;
        let timerInterval;
        let positions = [];
        
        let totalDistance = 0;
        let maxSpeed = 0;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const valSpeed = document.getElementById('val-speed');
        const valDist = document.getElementById('val-dist');
        const valAvg = document.getElementById('val-avg');
        const valMax = document.getElementById('val-max');
        const valEle = document.getElementById('val-ele');
        const timeDisplay = document.getElementById('time-display');

        // Logic Modal Riwayat
        const modal = document.getElementById("historyModal");
        document.getElementById("historyBtn").onclick = () => {
            modal.style.display = "block";
            if(window.loadHistoryFromFirebase) window.loadHistoryFromFirebase();
        }
        document.querySelector(".close-modal").onclick = () => { modal.style.display = "none"; }
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }

        function initMap(lat, lng) {
            if (!map) {
                map = L.map('map').setView([lat, lng], 16);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19, attribution: '© OpenStreetMap'
                }).addTo(map);
                polyline = L.polyline([], {color: '#ff4444', weight: 5}).addTo(map);
            } else {
                map.setView([lat, lng]); // Peta selalu mengikuti titik pusat
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateTimer() {
            const diff = new Date(Date.now() - startTime);
            const hh = String(diff.getUTCHours()).padStart(2, '0');
            const mm = String(diff.getUTCMinutes()).padStart(2, '0');
            const ss = String(diff.getUTCSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${hh}:${mm}:${ss}`;
        }

        startBtn.addEventListener('click', () => {
            if (!navigator.geolocation) return alert("GPS tidak didukung.");
            
            isTracking = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);

            if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});

            watchId = navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const speed = (position.coords.speed || 0) * 3.6;
                const alt = position.coords.altitude;
                const accuracy = position.coords.accuracy;

                if (accuracy > 35) return; // Tolak GPS nyasar

                initMap(lat, lng);
                polyline.addLatLng([lat, lng]);

                // Buat atau perbarui titik lokasi pengguna (Blue Dot)
                if (!userMarker) {
                    userMarker = L.circleMarker([lat, lng], {
                        radius: 7, fillColor: "#0088ff", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 1
                    }).addTo(map);
                } else {
                    userMarker.setLatLng([lat, lng]);
                }

                if (positions.length > 0) {
                    totalDistance += calculateDistance(positions[positions.length-1].lat, positions[positions.length-1].lng, lat, lng);
                }
                positions.push({lat, lng});

                let currentSpeed = speed < 1.5 ? 0 : speed;
                if (currentSpeed > maxSpeed) maxSpeed = currentSpeed;
                
                let durationHours = (Date.now() - startTime) / 3600000;
                let avgSpeed = durationHours > 0 ? totalDistance / durationHours : 0;

                valSpeed.textContent = currentSpeed.toFixed(1);
                valDist.textContent = totalDistance.toFixed(2);
                valMax.textContent = maxSpeed.toFixed(1);
                valAvg.textContent = avgSpeed.toFixed(1);
                if (alt) valEle.textContent = Math.round(alt);

            }, (err) => console.warn(err.message), {
                enableHighAccuracy: true, maximumAge: 0, timeout: 5000
            });
        });

        stopBtn.addEventListener('click', () => {
            navigator.geolocation.clearWatch(watchId);
            clearInterval(timerInterval);
            startBtn.style.display = 'block'; stopBtn.style.display = 'none';

            if (window.saveRouteToFirebase && totalDistance > 0) {
                window.saveRouteToFirebase({
                    distance: parseFloat(totalDistance.toFixed(2)),
                    maxSpeed: parseFloat(maxSpeed.toFixed(1)),
                    avgSpeed: parseFloat(valAvg.textContent)
                });
            }
            
            totalDistance = 0; maxSpeed = 0; positions = [];
            if(polyline) polyline.setLatLngs([]);
            timeDisplay.textContent = "00:00:00";
        });
    </script>
</body>
</html>
