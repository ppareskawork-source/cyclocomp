<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>CycloComp Pro with Firebase</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        body {
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .leaflet-control-zoom { display: none; }
        
        /* Custom scrollbar for history list */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col font-sans overflow-hidden">

    <!-- Top Status Bar -->
    <div class="flex justify-between items-center px-4 py-2 bg-gray-900 border-b border-gray-800 z-10">
        <div class="flex space-x-2 items-center">
            <span class="text-gray-400 text-sm font-bold tracking-wider">CYCLOCOMP</span>
            <div id="auth-status" class="w-2 h-2 rounded-full bg-red-500 animate-pulse" title="Firebase Disconnected"></div>
        </div>
        <div class="flex space-x-3 items-center">
            <button id="btn-history" class="text-xs bg-blue-900/50 text-blue-300 px-3 py-1 rounded-full border border-blue-800 disabled:opacity-50">
                RIWAYAT
            </button>
            <div id="gps-status" class="text-[10px] font-bold px-2 py-1 rounded-full bg-red-900 text-red-300">GPS OFFLINE</div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="flex flex-col px-3 py-2 z-10 bg-black/90 shadow-md">
        <!-- Speed & Time -->
        <div class="flex justify-between items-end mb-2">
            <div class="flex flex-col">
                <span class="text-gray-500 text-[10px] font-bold tracking-widest uppercase">Kecepatan</span>
                <div class="flex items-baseline">
                    <span id="speed-display" class="text-7xl font-extrabold leading-none tracking-tighter tabular-nums text-white">0.0</span>
                    <span class="text-lg font-bold text-gray-500 ml-1">km/h</span>
                </div>
            </div>
            <div class="flex flex-col items-end text-right pb-1">
                <span class="text-gray-500 text-[10px] font-bold tracking-widest uppercase">Waktu</span>
                <span id="time-display" class="text-3xl font-bold tabular-nums text-yellow-400">00:00:00</span>
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-4 gap-2 border-t border-gray-800 pt-2">
            <div class="flex flex-col bg-gray-900 p-2 rounded-lg">
                <span class="text-gray-500 text-[9px] font-bold uppercase mb-1">Jarak (km)</span>
                <span id="distance-display" class="text-xl font-bold tabular-nums text-blue-400">0.00</span>
            </div>
            <div class="flex flex-col bg-gray-900 p-2 rounded-lg">
                <span class="text-gray-500 text-[9px] font-bold uppercase mb-1">Avg (km/h)</span>
                <span id="avg-speed-display" class="text-xl font-bold tabular-nums text-green-400">0.0</span>
            </div>
            <div class="flex flex-col bg-gray-900 p-2 rounded-lg">
                <span class="text-gray-500 text-[9px] font-bold uppercase mb-1">Max (km/h)</span>
                <span id="max-speed-display" class="text-xl font-bold tabular-nums text-purple-400">0.0</span>
            </div>
            <div class="flex flex-col bg-gray-900 p-2 rounded-lg">
                <span class="text-gray-500 text-[9px] font-bold uppercase mb-1">Elevasi (m)</span>
                <span id="elevation-display" class="text-xl font-bold tabular-nums text-orange-400">--</span>
            </div>
        </div>
    </div>

    <!-- Map Area -->
    <div class="flex-1 relative z-0 border-y border-gray-700">
        <div id="map" class="w-full h-full bg-gray-800"></div>
        <button id="btn-recenter" class="absolute bottom-4 right-4 z-[400] bg-blue-600 p-3 rounded-full shadow-lg hidden">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
    </div>

    <!-- Controls -->
    <div class="p-3 bg-gray-900 z-10">
        <div class="flex space-x-3">
            <button id="btn-start" class="flex-1 bg-green-600 active:bg-green-700 text-white rounded-xl py-4 text-xl font-bold shadow-[0_4px_0_rgb(22,101,52)] active:shadow-none active:translate-y-1 transition-all">
                START
            </button>
            <button id="btn-pause" class="hidden flex-1 bg-yellow-500 active:bg-yellow-600 text-black rounded-xl py-4 text-xl font-bold shadow-[0_4px_0_rgb(161,98,7)] active:shadow-none active:translate-y-1 transition-all">
                PAUSE
            </button>
            <button id="btn-stop" class="w-1/3 bg-red-600 active:bg-red-700 text-white rounded-xl py-4 text-sm font-bold shadow-[0_4px_0_rgb(153,27,27)] active:shadow-none active:translate-y-1 transition-all hidden">
                STOP & SAVE
            </button>
        </div>
    </div>

    <!-- Modal: Stop Confirmation -->
    <div id="modal-stop" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex-col items-center justify-center z-[1000] p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl">
            <h3 class="text-2xl font-bold mb-2">Selesai Bersepeda?</h3>
            <p class="text-gray-400 text-sm mb-6">Data ini akan disimpan ke riwayat Anda.</p>
            <div class="flex space-x-3">
                <button id="btn-cancel-stop" class="flex-1 bg-gray-700 active:bg-gray-600 text-white rounded-xl py-3 font-bold">Batal</button>
                <button id="btn-confirm-save" class="flex-1 bg-green-600 active:bg-green-700 text-white rounded-xl py-3 font-bold flex justify-center items-center">
                    <span id="save-text">Simpan</span>
                    <svg id="save-spinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </div>
            <button id="btn-discard" class="mt-4 text-red-500 text-sm underline active:text-red-400">Buang Data Tanpa Disimpan</button>
        </div>
    </div>

    <!-- Modal: History -->
    <div id="modal-history" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden flex-col z-[1000]">
        <div class="flex justify-between items-center p-4 border-b border-gray-800">
            <h2 class="text-xl font-bold">Riwayat Bersepeda</h2>
            <button id="btn-close-history" class="text-gray-400 p-2 bg-gray-800 rounded-full active:bg-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="history-loading" class="flex-1 flex justify-center items-center">
            <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3 hidden">
            <!-- Items will be injected here -->
        </div>
        <div id="history-empty" class="flex-1 flex flex-col justify-center items-center hidden text-gray-500">
            <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p>Belum ada riwayat.</p>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded-full shadow-lg text-sm font-bold opacity-0 transition-opacity duration-300 pointer-events-none z-[2000]">
        Notifikasi
    </div>

    <script type="module">
        // ==========================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // DUMMY CONFIG - REPLACE THIS WITH YOUR FIREBASE CONFIG
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyDPKhGq_dGVqGViQIwbDHtwAA7DLfuNYa4",
            authDomain: "cyclocomp-f9bdb.firebaseapp.com",
            projectId: "cyclocomp-f9bdb",
            storageBucket: "cyclocomp-f9bdb.firebasestorage.app",
            messagingSenderId: "942879429280",
            appId: "1:942879429280:web:3b44bf2262cb082b5c6fc5",
            measurementId: "G-M45DT3DHST"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'cyclocomp-local-dev';
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUserId = null;

        // ==========================================
        // 2. STATE VARIABLES
        // ==========================================
        let watchId = null;
        let wakeLock = null;
        let timerInterval = null;
        
        let isTracking = false;
        let isPaused = false;
        let startTime = 0;
        let elapsedMs = 0; 
        
        let totalDistance = 0; // km
        let maxSpeed = 0; // km/h
        let currentSpeed = 0;
        let avgSpeed = 0;
        let lastPosition = null; 
        let routeCoords = []; 
        let isMapInitialized = false;

        let map, polyline, userMarker;

        // ==========================================
        // 3. DOM ELEMENTS
        // ==========================================
        const ui = {
            speed: document.getElementById('speed-display'),
            distance: document.getElementById('distance-display'),
            time: document.getElementById('time-display'),
            avgSpeed: document.getElementById('avg-speed-display'),
            maxSpeed: document.getElementById('max-speed-display'),
            elevation: document.getElementById('elevation-display'),
            
            gpsStatus: document.getElementById('gps-status'),
            authStatus: document.getElementById('auth-status'),
            
            btnStart: document.getElementById('btn-start'),
            btnPause: document.getElementById('btn-pause'),
            btnStop: document.getElementById('btn-stop'),
            btnRecenter: document.getElementById('btn-recenter'),
            btnHistory: document.getElementById('btn-history'),
            
            modalStop: document.getElementById('modal-stop'),
            btnCancelStop: document.getElementById('btn-cancel-stop'),
            btnConfirmSave: document.getElementById('btn-confirm-save'),
            btnDiscard: document.getElementById('btn-discard'),
            saveSpinner: document.getElementById('save-spinner'),
            saveText: document.getElementById('save-text'),
            
            modalHistory: document.getElementById('modal-history'),
            btnCloseHistory: document.getElementById('btn-close-history'),
            historyList: document.getElementById('history-list'),
            historyLoading: document.getElementById('history-loading'),
            historyEmpty: document.getElementById('history-empty'),
            
            toast: document.getElementById('toast')
        };

        // ==========================================
        // 4. AUTHENTICATION (Rule 3)
        // ==========================================
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUserId = auth.currentUser.uid;
                
                // Update UI visually
                ui.authStatus.classList.remove('bg-red-500', 'animate-pulse');
                ui.authStatus.classList.add('bg-green-500');
                ui.authStatus.title = "Firebase Connected";
                ui.btnHistory.disabled = false;
                
            } catch (error) {
                console.error("Auth Error:", error);
                showToast("Gagal terhubung ke Database");
            }
        }

        // ==========================================
        // 5. UTILITIES
        // ==========================================
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function formatTime(ms) {
            const totalSecs = Math.floor(ms / 1000);
            const h = Math.floor(totalSecs / 3600).toString().padStart(2, '0');
            const m = Math.floor((totalSecs % 3600) / 60).toString().padStart(2, '0');
            const s = (totalSecs % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function showToast(message) {
            ui.toast.textContent = message;
            ui.toast.classList.remove('opacity-0');
            setTimeout(() => ui.toast.classList.add('opacity-0'), 3000);
        }

        function setGpsStatus(msg, state = 'warn') {
            ui.gpsStatus.textContent = msg;
            if (state === 'ok') ui.gpsStatus.className = 'text-[10px] font-bold px-2 py-1 rounded-full bg-green-900 text-green-300';
            else if (state === 'err') ui.gpsStatus.className = 'text-[10px] font-bold px-2 py-1 rounded-full bg-red-900 text-red-300';
            else ui.gpsStatus.className = 'text-[10px] font-bold px-2 py-1 rounded-full bg-yellow-900 text-yellow-300';
        }

        // ==========================================
        // 6. MAP & GEOLOCATION
        // ==========================================
        function initMap(lat, lon) {
            if (isMapInitialized) return;
            map = L.map('map', { zoomControl: false }).setView([lat, lon], 16);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap & CartoDB'
            }).addTo(map);

            polyline = L.polyline([], {color: '#ef4444', weight: 4, opacity: 0.8}).addTo(map);
            userMarker = L.circleMarker([lat, lon], {
                radius: 6, fillColor: "#3b82f6", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.8
            }).addTo(map);

            isMapInitialized = true;
            ui.btnRecenter.classList.remove('hidden');
        }

        function updateTimer() {
            const now = Date.now();
            const currentElapsed = elapsedMs + (now - startTime);
            ui.time.textContent = formatTime(currentElapsed);

            const hours = currentElapsed / 3600000;
            if (hours > 0 && totalDistance > 0) {
                avgSpeed = totalDistance / hours;
                ui.avgSpeed.textContent = avgSpeed.toFixed(1);
            }
        }

        function handlePosition(position) {
            setGpsStatus('GPS AKTIF', 'ok');
            const { latitude: lat, longitude: lon, accuracy, altitude, speed: nativeSpeed } = position.coords;
            const timestamp = position.timestamp;

            if (!isMapInitialized) initMap(lat, lon);
            if (altitude !== null) ui.elevation.textContent = Math.round(altitude);

            if (isMapInitialized && accuracy < 50) {
                userMarker.setLatLng([lat, lon]);
                if (isTracking && !isPaused) {
                    routeCoords.push([lat, lon]);
                    polyline.setLatLngs(routeCoords);
                    map.panTo([lat, lon]);
                }
            }

            if (accuracy > 30) return; // Skip bad data

            let speedKmh = 0;
            if (nativeSpeed !== null && nativeSpeed >= 0) {
                speedKmh = nativeSpeed * 3.6;
            } else if (lastPosition) {
                const distManual = calculateDistance(lastPosition.lat, lastPosition.lon, lat, lon);
                const timeDiffHours = (timestamp - lastPosition.timestamp) / 3600000;
                if (timeDiffHours > 0) speedKmh = distManual / timeDiffHours;
            }

            if (speedKmh < 2.0) speedKmh = 0;
            currentSpeed = speedKmh;
            ui.speed.textContent = speedKmh.toFixed(1);

            if (speedKmh > maxSpeed) {
                maxSpeed = speedKmh;
                ui.maxSpeed.textContent = maxSpeed.toFixed(1);
            }

            if (lastPosition && isTracking && !isPaused) {
                const dist = calculateDistance(lastPosition.lat, lastPosition.lon, lat, lon);
                if (dist > 0.003 && speedKmh > 0) { 
                    totalDistance += dist;
                    ui.distance.textContent = totalDistance.toFixed(2);
                }
            }
            lastPosition = { lat, lon, timestamp };
        }

        function handleError(error) {
            let msg = 'ERROR';
            if (error.code === 1) msg = 'IZIN GPS DITOLAK';
            if (error.code === 2) msg = 'LOKASI TIDAK TERSEDIA';
            if (error.code === 3) msg = 'TIMEOUT';
            setGpsStatus(msg, 'err');
            ui.speed.textContent = '0.0';
        }

        // ==========================================
        // 7. TRACKING CONTROLS
        // ==========================================
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
        }

        function startTracking() {
            if (!("geolocation" in navigator)) {
                showToast("GPS Tidak Didukung");
                return;
            }
            isTracking = true;
            isPaused = false;
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            requestWakeLock();

            ui.btnStart.classList.add('hidden');
            ui.btnPause.classList.remove('hidden');
            ui.btnStop.classList.remove('hidden');
            
            setGpsStatus('MENCARI GPS...', 'warn');

            if (!watchId) {
                watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
                    enableHighAccuracy: true, maximumAge: 0, timeout: 10000
                });
            }
        }

        function pauseTracking() {
            isPaused = true;
            elapsedMs += (Date.now() - startTime);
            clearInterval(timerInterval);
            releaseWakeLock();

            ui.btnPause.classList.add('hidden');
            ui.btnStart.classList.remove('hidden');
            ui.btnStart.textContent = "RESUME";
            
            setGpsStatus('PAUSED', 'warn');
            ui.speed.textContent = '0.0'; 
            lastPosition = null; 
        }

        function resetUI() {
            elapsedMs = 0; totalDistance = 0; maxSpeed = 0; avgSpeed = 0; lastPosition = null; routeCoords = [];
            isTracking = false; isPaused = false;
            
            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            clearInterval(timerInterval);
            releaseWakeLock();

            ui.time.textContent = '00:00:00';
            ui.distance.textContent = '0.00';
            ui.speed.textContent = '0.0';
            ui.avgSpeed.textContent = '0.0';
            ui.maxSpeed.textContent = '0.0';
            
            ui.btnStart.classList.remove('hidden');
            ui.btnStart.textContent = "START";
            ui.btnPause.classList.add('hidden');
            ui.btnStop.classList.add('hidden');
            
            if (polyline) polyline.setLatLngs([]);
            setGpsStatus('STANDBY', 'warn');
            ui.modalStop.classList.add('hidden');
            ui.modalStop.classList.remove('flex');
        }

        // ==========================================
        // 8. FIRESTORE OPERATIONS
        // ==========================================
        async function saveRideData() {
            if (!currentUserId) {
                showToast("Menunggu koneksi Database...");
                return;
            }
            if (totalDistance < 0.1) {
                showToast("Jarak terlalu pendek untuk disimpan.");
                resetUI();
                return;
            }

            ui.saveText.textContent = "Menyimpan...";
            ui.saveSpinner.classList.remove('hidden');
            ui.btnConfirmSave.disabled = true;

            const currentElapsed = isPaused ? elapsedMs : elapsedMs + (Date.now() - startTime);

            try {
                // Rule 1: Strict Paths
                const ridesRef = collection(db, 'artifacts', APP_ID, 'users', currentUserId, 'rides');
                
                await addDoc(ridesRef, {
                    timestamp: new Date().toISOString(),
                    distanceKm: Number(totalDistance.toFixed(2)),
                    durationMs: currentElapsed,
                    avgSpeedKmh: Number(avgSpeed.toFixed(1)),
                    maxSpeedKmh: Number(maxSpeed.toFixed(1))
                });
                
                showToast("Data berhasil disimpan!");
                resetUI();
            } catch (error) {
                console.error("Save Error:", error);
                showToast("Gagal menyimpan data.");
            } finally {
                ui.saveText.textContent = "Simpan";
                ui.saveSpinner.classList.add('hidden');
                ui.btnConfirmSave.disabled = false;
            }
        }

        async function fetchHistory() {
            if (!currentUserId) return;
            
            ui.modalHistory.classList.remove('hidden');
            ui.modalHistory.classList.add('flex');
            ui.historyLoading.classList.remove('hidden');
            ui.historyList.classList.add('hidden');
            ui.historyEmpty.classList.add('hidden');
            ui.historyList.innerHTML = '';

            try {
                // Rule 1: Strict Paths
                const ridesRef = collection(db, 'artifacts', APP_ID, 'users', currentUserId, 'rides');
                
                // Rule 2: Fetch all, sort in memory
                const snapshot = await getDocs(ridesRef);
                const rides = [];
                snapshot.forEach(doc => {
                    rides.push({ id: doc.id, ...doc.data() });
                });

                if (rides.length === 0) {
                    ui.historyLoading.classList.add('hidden');
                    ui.historyEmpty.classList.remove('hidden');
                    return;
                }

                // Sort by timestamp descending
                rides.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                rides.forEach(ride => {
                    const dateObj = new Date(ride.timestamp);
                    const dateStr = dateObj.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
                    const timeStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    
                    const el = document.createElement('div');
                    el.className = "bg-gray-900 border border-gray-700 p-4 rounded-xl flex flex-col";
                    el.innerHTML = `
                        <div class="flex justify-between items-center mb-2 border-b border-gray-800 pb-2">
                            <span class="font-bold text-gray-300">${dateStr}, ${timeStr}</span>
                            <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400">${formatTime(ride.durationMs)}</span>
                        </div>
                        <div class="flex justify-between mt-1">
                            <div class="flex flex-col">
                                <span class="text-[10px] text-gray-500 uppercase">Jarak</span>
                                <span class="font-bold text-blue-400">${ride.distanceKm} <span class="text-xs">km</span></span>
                            </div>
                            <div class="flex flex-col text-center">
                                <span class="text-[10px] text-gray-500 uppercase">Rata-rata</span>
                                <span class="font-bold text-green-400">${ride.avgSpeedKmh} <span class="text-xs">km/h</span></span>
                            </div>
                            <div class="flex flex-col text-right">
                                <span class="text-[10px] text-gray-500 uppercase">Max</span>
                                <span class="font-bold text-purple-400">${ride.maxSpeedKmh} <span class="text-xs">km/h</span></span>
                            </div>
                        </div>
                    `;
                    ui.historyList.appendChild(el);
                });

                ui.historyLoading.classList.add('hidden');
                ui.historyList.classList.remove('hidden');

            } catch (error) {
                console.error("Fetch History Error:", error);
                ui.historyLoading.classList.add('hidden');
                ui.historyList.innerHTML = `<div class="text-red-500 text-center p-4">Gagal memuat data.</div>`;
                ui.historyList.classList.remove('hidden');
            }
        }

        // ==========================================
        // 9. EVENT LISTENERS
        // ==========================================
        ui.btnStart.addEventListener('click', startTracking);
        ui.btnPause.addEventListener('click', pauseTracking);
        
        ui.btnStop.addEventListener('click', () => {
            if (!isPaused) pauseTracking();
            ui.modalStop.classList.remove('hidden');
            ui.modalStop.classList.add('flex');
        });
        
        ui.btnCancelStop.addEventListener('click', () => {
            ui.modalStop.classList.add('hidden');
            ui.modalStop.classList.remove('flex');
        });
        
        ui.btnDiscard.addEventListener('click', resetUI);
        ui.btnConfirmSave.addEventListener('click', saveRideData);

        ui.btnRecenter.addEventListener('click', () => {
            if (map && userMarker) map.setView(userMarker.getLatLng(), 16);
        });

        ui.btnHistory.addEventListener('click', fetchHistory);
        ui.btnCloseHistory.addEventListener('click', () => {
            ui.modalHistory.classList.add('hidden');
            ui.modalHistory.classList.remove('flex');
        });

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && isTracking && !isPaused) {
                await requestWakeLock();
            }
        });

        // Initialize Map and Auth on Load
        window.addEventListener('load', () => {
            initAuth();
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => initMap(pos.coords.latitude, pos.coords.longitude),
                    (err) => console.warn('Loc init fail:', err),
                    { enableHighAccuracy: true }
                );
            }
        });

    </script>
</body>
</html>
